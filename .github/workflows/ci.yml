name: CI

on:
  push:
    branches: [master]
  pull_request:

# لو اتعمل push تاني على نفس الفرع، ألغي التشغيل القديم
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci مش install: بيثبّت من package-lock بالظبط وبيفشل لو مش متطابق
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
